<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Smart Compose</title>
 <!-- Same proven SDK source as MagnoliaMap v3.23 (works in production) -->
 <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
 <style>
 body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; margin: 0; background: #fff; }
 h3 { margin: 0 0 4px 0; font-size: 16px; font-weight: 600; color: #1a1a1a; }
 .subtitle { font-size: 12px; color: #666; margin-bottom: 16px; }
 #loading { color: #666; font-size: 14px; text-align: center; margin-top: 20px; }
 #error { display: none; color: #d32f2f; font-size: 13px; text-align: center; margin-top: 12px; padding: 10px; background: #fdecea; border-radius: 4px; }
 #app-container { display: none; }
 .kai-row { display: flex; align-items: center; padding: 8px 10px; border-radius: 4px; margin-bottom: 4px; border: 1px solid #e9ecef; background: #f8f9fa; }
 .kai-row:hover { background: #e9ecef; }
 .kai-row.disabled { opacity: 0.4; cursor: not-allowed; }
 .kai-row input[type='checkbox'] { margin-right: 10px; cursor: pointer; }
 .kai-info { flex: 1; min-width: 0; }
 .kai-role { font-weight: 600; font-size: 13px; color: #333; }
 .kai-email { font-size: 11px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 .kai-select { font-size: 11px; color: #1976d2; border: 1px solid #ccc; background: #fff; border-radius: 3px; padding: 2px 4px; cursor: pointer; }
 .kai-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid #e9ecef; }
 .kai-btn { padding: 8px 18px; font-size: 13px; font-weight: 500; border: none; border-radius: 4px; cursor: pointer; }
 .kai-primary { background: #1976d2; color: #fff; }
 .kai-primary:hover { background: #1565c0; }
 .kai-secondary { background: #e9ecef; color: #333; }
 .kai-secondary:hover { background: #dee2e6; }
 </style>
</head>
<body>

 <div id="loading">Loading record data...</div>
 <div id="error"></div>

 <div id="app-container">
 <h3>&#128231; Smart Compose</h3>
 <div class="subtitle">Select recipients and routing, then open the native email composer.</div>
 <div id="email-list"></div>
 <div class="kai-actions">
 <button class="kai-btn kai-secondary" id="btn-cancel">Cancel</button>
 <button class="kai-btn kai-primary" id="btn-send">Open Email Composer</button>
 </div>
 </div>

 <script>
 var EMAIL_SOURCES = [
 { apiName: "Adjuster_Email", role: "Adjuster", nameField: "Adjuster_Name" },
 { apiName: "Email", role: "Claimant", nameField: "Claimant_Name" },
 { apiName: "Physician_Email", role: "Physician", nameField: "Physician_Name" },
 { apiName: "NCM_Email", role: "NCM", nameField: "NCM_Name" },
 { apiName: "Prov_Email", role: "Provider", nameField: "Provider_Name" },
 { apiName: "Atty_Email", role: "Attorney", nameField: "Attorney_Name" }
 ];

 var currentRecordId = "";

 // Helper to show errors in the widget UI
 function showError(msg) {
 var el = document.getElementById("error");
 el.innerText = msg;
 el.style.display = "block";
 }

 ZOHO.embeddedApp.on("PageLoad", function(data) {
 console.log("SmartCompose PageLoad data:", JSON.stringify(data));

 if (!data || !data.EntityId) {
 showError("No record context received from Zoho.");
 return;
 }

 // Button widget may pass EntityId as string or array; normalize to string
 // Same approach as MagnoliaMap: pass the record ID directly
 var recordId = Array.isArray(data.EntityId) ? data.EntityId[0] : data.EntityId;
 currentRecordId = recordId;
 loadReferralData(recordId);
 });

 ZOHO.embeddedApp.init().then(function() {
 console.log("SmartCompose SDK initialized");
 }).catch(function(e) {
 showError("SDK init failed: " + (e.message || JSON.stringify(e)));
 });

 function loadReferralData(recordId) {
 // Hardcode "Deals" like MagnoliaMap — same Referrals module
 ZOHO.CRM.API.getRecord({ Entity: "Deals", RecordID: recordId })
 .then(function(resp) {
 if (resp.data && resp.data[0]) {
 renderUI(resp.data[0]);
 } else {
 showError("Record not found (empty response).");
 }
 })
 .catch(function(e) {
 showError("API error: " + (e.message || JSON.stringify(e)));
 console.error("getRecord error:", e);
 });
 }

 function renderUI(record) {
 document.getElementById("loading").style.display = "none";
 document.getElementById("app-container").style.display = "block";

 var listContainer = document.getElementById("email-list");
 var html = "";

 for (var i = 0; i < EMAIL_SOURCES.length; i++) {
 var src = EMAIL_SOURCES[i];
 var email = (record[src.apiName] || "").toString().trim();
 var name = src.nameField ? (record[src.nameField] || "").toString().trim() : "";

 if (email) {
 html += '<div class="kai-row" data-email="' + email.replace(/"/g,'&quot;') + '">'
 + '<input type="checkbox" checked class="email-cb" />'
 + '<div class="kai-info">'
 + '<div class="kai-role">' + src.role + '</div>'
 + '<div class="kai-email">' + email.replace(/"/g,'&quot;') + (name ? ' &mdash; ' + name.replace(/"/g,'&quot;') : '') + '</div>'
 + '</div>'
 + '<select class="kai-select route-select">'
 + '<option value="to">To</option>'
 + '<option value="cc">Cc</option>'
 + '<option value="bcc">Bcc</option>'
 + '</select>'
 + '</div>';
 } else {
 html += '<div class="kai-row disabled">'
 + '<input type="checkbox" disabled />'
 + '<div class="kai-info">'
 + '<div class="kai-role">' + src.role + '</div>'
 + '<div class="kai-email" style="font-style:italic;">No email on record</div>'
 + '</div>'
 + '</div>';
 }
 }

 if (html === "") {
 listContainer.innerHTML = "<div style='text-align:center; padding: 20px; color: #999;'>No configured email fields found on this record.</div>";
 document.getElementById("btn-send").style.display = "none";
 } else {
 listContainer.innerHTML = html;
 }
 }

 document.getElementById("btn-cancel").addEventListener("click", function() {
 ZOHO.CRM.UI.Popup.close();
 });

 document.getElementById("btn-cancel").addEventListener("click", function() {
 console.log("Cancel clicked");
 try { ZOHO.CRM.UI.Popup.close(); } catch(e) { showError('Popup.close error: ' + e.message); }
 });

 // Build mailto: link from selected recipients
 function buildMailto(toList, ccList, bccList) {
 var parts = ["mailto:" + toList.join(",")];
 if (ccList.length) parts.push("cc=" + ccList.join(","));
 if (bccList.length) parts.push("bcc=" + bccList.join(","));
 return parts.join("?");
 }

 // Open email by popping out to a new window.
 // From an iframe, window.open() creates a new top-level window which
 // CAN handle protocol navigation (mailto:) without the OS chooser dialog.
 function openEmail(toList, ccList, bccList) {
 var url = "mailto:" + encodeURIComponent(toList.join(",")) + "?"
 + "cc=" + encodeURIComponent(ccList.join(",")) + "&bcc=" + encodeURIComponent(bccList.join(","));
 console.log("Opening email via popup:", url);

 // Try opening a tiny popup window first, then navigate it to mailto:
 // Popups are top-level windows so protocol handlers work properly.
 var popup = window.open(url, "_blank", "width=1,height=1,left=-1000,top=-1000");
 if (popup && !popup.closed) {
 console.log("Popup opened, navigating to mailto:");
 // Close the widget
 setTimeout(function() {
 try { ZOHO.CRM.UI.Popup.close(); } catch(e) { }
 }, 300);
 } else {
 // Popup blocked — use clipboard fallback
 console.log("Popup blocked, copying to clipboard");
 var emailText = "To: " + toList.join(", ");
 if (ccList.length) emailText += "\nCc: " + ccList.join(", ");
 if (bccList.length) emailText += "\nBcc: " + bccList.join(", ");

 var ta = document.createElement("textarea");
 ta.value = emailText;
 ta.style.position = "fixed";
 ta.style.opacity = "0";
 document.body.appendChild(ta);
 ta.select();
 document.execCommand("copy");
 document.body.removeChild(ta);

 showError("Emails copied! Use Zoho's email button on the record to send.");
 document.getElementById("btn-send").style.display = "none";
 document.getElementById("btn-cancel").innerText = "Close";
 }
 }

 document.getElementById("btn-send").addEventListener("click", function() {
 console.log("Send button clicked");
 showError("");

 try {
 var toList = [];
 var ccList = [];
 var bccList = [];

 var rows = document.querySelectorAll('.kai-row:not(.disabled)');

 for (var i = 0; i < rows.length; i++) {
 var row = rows[i];
 var cb = row.querySelector('.email-cb');
 if (cb && cb.checked) {
 var email = row.getAttribute('data-email');
 var routing = row.querySelector('.route-select').value;

 if (routing === 'to') toList.push(email);
 if (routing === 'cc') ccList.push(email);
 if (routing === 'bcc') bccList.push(email);
 }
 }

 if (toList.length === 0 && ccList.length === 0 && bccList.length === 0) {
 showError("Please select at least one recipient.");
 return;
 }

 // Log what we collected
 console.log("Mail params:", JSON.stringify({ to: toList, cc: ccList, bcc: bccList }));

 // Attempt Zoho native composer first (may not be available in widget context)
 if (ZOHO.CRM && ZOHO.CRM.Email && ZOHO.CRM.Email.sendMail) {
 console.log("Using ZOHO.CRM.Email.sendMail");
 ZOHO.CRM.Email.sendMail({
 to: toList.join(","),
 cc: ccList.join(","),
 bcc: bccList.join(","),
 module: "Deals",
 recordId: currentRecordId
 }).then(function() {
 console.log("sendMail succeeded");
 setTimeout(function() {
 try { ZOHO.CRM.UI.Popup.close(); } catch(e) {}
 }, 500);
 }).catch(function(e) {
 showError("sendMail failed: " + (e.message || JSON.stringify(e)));
 });
 } else {
 // Fallback: pop up a new window which can handle mailto: as a top-level window
 console.log("Zoho sendMail not available; opening email via popup");
 openEmail(toList, ccList, bccList);
 }
 // Close the widget popup
 setTimeout(function() {
 try { ZOHO.CRM.UI.Popup.close(); } catch(e) {}
 }, 200);
 }
 } catch(e) {
 showError("Button handler error: " + (e.message || JSON.stringify(e)));
 console.error("Click handler error:", e);
 }
 });
 </script>
</body>
</html>
