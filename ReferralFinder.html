<!DOCTYPE html>
<html>
<head>
    <title>Magnolia ReferralFinder v1.1</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
            overflow-y: auto;
        }
        .search-container {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 1200px;
            margin: 20px auto;
        }
        h2 {
            margin: 0 0 24px 0;
            color: #1a202c;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
        }
        h2::before {
            content: "🔍";
            margin-right: 10px;
            font-size: 20px;
        }
        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
        }
        input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
        }
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid #e2e8f0;
            padding-top: 24px;
        }
        button {
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 14px;
        }
        .btn-search {
            background: #3182ce;
            color: white;
        }
        .btn-search:hover {
            background: #2c5282;
            transform: translateY(-1px);
        }
        .btn-clear {
            background: #edf2f7;
            color: #4a5568;
        }
        .btn-clear:hover {
            background: #e2e8f0;
        }
        #results {
            margin-top: 24px;
            display: none;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }
        th {
            background: #f7fafc;
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            color: #4a5568;
            border-bottom: 1px solid #e2e8f0;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            color: #2d3748;
        }
        /* Style 2 secondary row - spans full width below the primary row */
        tr.primary-row td { border-bottom: none; }
        tr.secondary-row td {
            padding: 6px 16px 14px 16px;
            font-size: 13px;
            color: #718096;
            background: #fafbfc;
        }
        tr.secondary-row td .label {
            color: #a0aec0;
            font-weight: 600;
            margin-right: 4px;
        }
        tr.secondary-row td .sep {
            color: #cbd5e0;
            margin: 0 10px;
        }
        tr:hover td { background: #ebf8ff; }
        tr.secondary-row:hover td { background: #e6f3fa; }
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active {
            background: #c6f6d5;
            color: #22543d;
        }
        .status-closed {
            background: #fed7d7;
            color: #822727;
        }
        .status-pending {
            background: #feebc8;
            color: #744210;
        }
        .btn-open {
            color: #3182ce;
            background: none;
            border: none;
            padding: 0;
            font: inherit;
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }
        .btn-open:hover {
            color: #2c5282;
        }
        .error-message {
            background: #fff5f5;
            color: #c53030;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #fed7d7;
            margin-top: 20px;
        }
        .result-count {
            color: #718096;
            font-size: 14px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <h2>ReferralFinder</h2>

        <div class="search-grid">
            <div class="field-group">
                <label>Claimant Name (Last, First)</label>
                <input type="text" id="record_name" placeholder="e.g. Smith, John">
            </div>
            <div class="field-group">
                <label>Claim Number</label>
                <input type="text" id="claim_number" placeholder="Enter Claim #">
            </div>
            <div class="field-group">
                <label>Referral ID</label>
                <input type="text" id="referral_id" placeholder="Enter ID">
            </div>
            <div class="field-group">
                <label>SSN (Last 4)</label>
                <input type="text" id="ssn" placeholder="Last 4 Digits" maxlength="4">
            </div>
            <div class="field-group">
                <label>Date of Birth</label>
                <input type="date" id="claimant_dob">
            </div>
            <div class="field-group">
                <label>Payer Name</label>
                <input type="text" id="payer_name" placeholder="Enter Payer Name">
            </div>
            <div class="field-group">
                <label>Adjuster Name</label>
                <input type="text" id="adjuster_name" placeholder="Enter Adjuster Name">
            </div>
        </div>

        <div class="button-group">
            <button class="btn-clear" onclick="clearForm()">Clear</button>
            <button class="btn-search" onclick="searchReferrals()">Search</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        // === ReferralFinder v1.1 ===
        // Implements spec from ReferralFinder-CHECKLIST.md (verified 2026-04-29).
        //
        // Fixes vs v1.0:
        //   - Issue: Payer/Adjuster names rendered as "[object Object]" in
        //     results because COQL responses don't expand Lookup fields the
        //     same way getRecord() does. Solution: maintain a client-side
        //     ID→displayName map populated from step-1 queries (Section 11.6,
        //     new quirk). Resolved on render via lookupName() helper.
        //   - Issue: Adjuster-only search produced INVALID_QUERY on
        //     Contact_Name. Root cause was the step-1 Contacts query failing
        //     to match natural-language adjuster names like "karen kyota"
        //     because LIKE matched the whole string against single fields.
        //     Solution: split the search term on whitespace and OR-match each
        //     token against both name fields. Also hardened the empty-IDs
        //     short-circuit to be defensive about edge cases.
        //   - Diagnostic instrumentation: every step logs structured progress
        //     so future "still failing" reports can be triaged from console.
        //
        // Side-bugs from v1.0 still retained per Option A scope (Section 12).

        function log(msg) { console.log('[ReferralFinder v1.1]', msg); }

        ZOHO.embeddedApp.init().then(function(){
            log("Widget loaded");
        });

        document.querySelectorAll('input').forEach(function(input) {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchReferrals();
            });
        });

        function clearForm() {
            document.querySelectorAll('input').forEach(function(input) {
                input.value = '';
            });
            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'none';
            resultsDiv.innerHTML = '';
        }

        // Quirk 11.3: COQL escape syntax is doubled single quote (O''Brien).
        // The current sanitize() uses backslash-escaping which COQL does not
        // recognize. Per Section 12.3, this is retained from baseline for v1.0.
        function sanitize(value) {
            return value.replace(/'/g, "\\'").trim();
        }

        // --- Two-step Lookup query helpers (Section 6.2) ---
        //
        // v1.1: Helpers now return both the IDs (for the step-2 IN clause) AND
        // a Map<id, displayName> so the results table can render the actual
        // payer/adjuster names. COQL responses for Lookup fields don't include
        // expanded display names by default, so we resolve them here.

        // Module-level maps that accumulate display names across searches.
        const accountNameById = new Map();   // Account.id -> Account_Name
        const contactNameById = new Map();   // Contact.id -> "Last, First"

        async function resolvePayerIds(searchTerm) {
            if (!searchTerm || !searchTerm.trim()) {
                return { ids: null, hadTerm: false };
            }
            const cleaned = sanitize(searchTerm);
            const query = "select id, Account_Name from Accounts where Account_Name like '%" + cleaned + "%' limit 200";
            log('Step 1 query (Accounts): ' + query);
            const resp = await ZOHO.CRM.API.coql({ select_query: query });
            const records = resp.data || [];
            log('Step 1 returned ' + records.length + ' Account(s)');
            // Populate the display-name map for later rendering.
            records.forEach(r => {
                if (r.id && r.Account_Name) accountNameById.set(r.id, r.Account_Name);
            });
            return { ids: records.map(r => r.id), hadTerm: true };
        }

        async function resolveAdjusterIds(searchTerm) {
            if (!searchTerm || !searchTerm.trim()) {
                return { ids: null, hadTerm: false };
            }
            // v1.1 fix: split natural-language input like "karen kyota" into
            // tokens and AND-match across First_Name + Last_Name. Each token
            // must match SOMEWHERE in either field. This is the closest COQL
            // can get to "fuzzy full-name match" without a dedicated full-text
            // search facility.
            const tokens = searchTerm.trim().split(/\s+/).filter(Boolean);
            if (tokens.length === 0) {
                return { ids: null, hadTerm: false };
            }
            const tokenClauses = tokens.map(t => {
                const c = sanitize(t);
                return "(Last_Name like '%" + c + "%' or First_Name like '%" + c + "%')";
            });
            const query = "select id, First_Name, Last_Name from Contacts where " +
                tokenClauses.join(' and ') + " limit 200";
            log('Step 1 query (Contacts): ' + query);
            const resp = await ZOHO.CRM.API.coql({ select_query: query });
            const records = resp.data || [];
            log('Step 1 returned ' + records.length + ' Contact(s)');
            records.forEach(r => {
                if (r.id) {
                    const display = [r.Last_Name, r.First_Name].filter(Boolean).join(', ');
                    contactNameById.set(r.id, display || '(unnamed contact)');
                }
            });
            return { ids: records.map(r => r.id), hadTerm: true };
        }

        // After step 2 returns results, fill in any Lookup display names that
        // weren't already resolved during step 1. This handles the case where
        // the user didn't search by Payer/Adjuster — we still want to show
        // those names in the secondary row of the results table.
        async function backfillLookupNames(records) {
            const accountIdsToFetch = new Set();
            const contactIdsToFetch = new Set();

            records.forEach(r => {
                const accId = lookupRawId(r.Account_Name);
                if (accId && !accountNameById.has(accId)) accountIdsToFetch.add(accId);
                const conId = lookupRawId(r.Contact_Name);
                if (conId && !contactNameById.has(conId)) contactIdsToFetch.add(conId);
            });

            const tasks = [];
            if (accountIdsToFetch.size > 0) {
                const ids = Array.from(accountIdsToFetch).map(id => "'" + id + "'").join(',');
                const q = "select id, Account_Name from Accounts where id in (" + ids + ") limit 200";
                log('Backfill query (Accounts): ' + q);
                tasks.push(
                    ZOHO.CRM.API.coql({ select_query: q }).then(resp => {
                        (resp.data || []).forEach(r => {
                            if (r.id && r.Account_Name) accountNameById.set(r.id, r.Account_Name);
                        });
                    })
                );
            }
            if (contactIdsToFetch.size > 0) {
                const ids = Array.from(contactIdsToFetch).map(id => "'" + id + "'").join(',');
                const q = "select id, First_Name, Last_Name from Contacts where id in (" + ids + ") limit 200";
                log('Backfill query (Contacts): ' + q);
                tasks.push(
                    ZOHO.CRM.API.coql({ select_query: q }).then(resp => {
                        (resp.data || []).forEach(r => {
                            if (r.id) {
                                const display = [r.Last_Name, r.First_Name].filter(Boolean).join(', ');
                                contactNameById.set(r.id, display || '(unnamed contact)');
                            }
                        });
                    })
                );
            }
            if (tasks.length > 0) await Promise.all(tasks);
        }

        // Extract the raw ID from a Lookup field value. COQL may return Lookups
        // as either a plain string ID, an object with .id, or null.
        function lookupRawId(val) {
            if (!val) return null;
            if (typeof val === 'string') return val;
            if (typeof val === 'object' && val.id) return val.id;
            return null;
        }

        async function searchReferrals() {
            const resultDiv = document.getElementById('results');
            resultDiv.innerHTML = '<div style="text-align:center; padding:20px; color:#666;">Searching records...</div>';
            resultDiv.style.display = 'block';

            const criteria = {
                'Deal_Name': document.getElementById('record_name').value,
                'Claim_Number': document.getElementById('claim_number').value,
                'Referral_Number': document.getElementById('referral_id').value,
                'SSN': document.getElementById('ssn').value,
                'Claimant_DOB': document.getElementById('claimant_dob').value,
                'payer_name': document.getElementById('payer_name').value,
                'adjuster_name': document.getElementById('adjuster_name').value
            };
            log('Search criteria: ' + JSON.stringify(criteria));

            const anyValue = Object.values(criteria).some(v => v && v.trim());
            if (!anyValue) {
                showError('Please enter at least one search term.');
                return;
            }

            try {
                // --- Step 1: resolve Lookup display names to IDs ---
                const [payerResult, adjusterResult] = await Promise.all([
                    resolvePayerIds(criteria['payer_name']),
                    resolveAdjusterIds(criteria['adjuster_name'])
                ]);
                log('Payer resolution: hadTerm=' + payerResult.hadTerm +
                    ', idCount=' + (payerResult.ids ? payerResult.ids.length : 0));
                log('Adjuster resolution: hadTerm=' + adjusterResult.hadTerm +
                    ', idCount=' + (adjusterResult.ids ? adjusterResult.ids.length : 0));

                // Section 6.3: short-circuit with specific error if a Lookup search returned zero matches.
                // v1.1: defensive — explicit array check before .length to handle any edge case
                // where ids comes back undefined.
                if (payerResult.hadTerm && (!payerResult.ids || payerResult.ids.length === 0)) {
                    showError("No payers match '" + criteria['payer_name'] + "'.");
                    return;
                }
                if (adjusterResult.hadTerm && (!adjusterResult.ids || adjusterResult.ids.length === 0)) {
                    showError("No adjusters match '" + criteria['adjuster_name'] + "'.");
                    return;
                }

                // --- Step 2: build the final Deals query ---
                let conditions = [];
                if (criteria['Deal_Name']) conditions.push("(Deal_Name like '%" + sanitize(criteria['Deal_Name']) + "%')");
                if (criteria['Claim_Number']) conditions.push("(Claim_Number like '%" + sanitize(criteria['Claim_Number']) + "%')");
                if (criteria['Referral_Number']) conditions.push("(Referral_Number like '%" + sanitize(criteria['Referral_Number']) + "%')");
                if (criteria['SSN']) conditions.push("(SSN like '%" + sanitize(criteria['SSN']) + "%')");
                if (criteria['Claimant_DOB']) conditions.push("(Claimant_DOB = '" + criteria['Claimant_DOB'] + "')");

                if (payerResult.hadTerm) {
                    const idList = payerResult.ids.map(id => "'" + id + "'").join(',');
                    conditions.push("(Account_Name in (" + idList + "))");
                }
                if (adjusterResult.hadTerm) {
                    const idList = adjusterResult.ids.map(id => "'" + id + "'").join(',');
                    conditions.push("(Contact_Name in (" + idList + "))");
                }

                const selectQuery =
                    'select Deal_Name, Referral_Number, Claim_Number, Claimant_DOB, ' +
                    'Referral_Status, Account_Name, Contact_Name, id ' +
                    'from Deals where ' + conditions.join(' and ') + ' limit 50';
                log('Step 2 query (Deals): ' + selectQuery);

                const data = await ZOHO.CRM.API.coql({ select_query: selectQuery });
                log('Step 2 returned ' + (data.data ? data.data.length : 0) + ' Deal(s)');

                if (data.data && data.data.length > 0) {
                    // v1.1: backfill any Lookup display names not already in the map.
                    await backfillLookupNames(data.data);
                    displayResults(data.data);
                } else {
                    showError('No referrals found matching your criteria.');
                }
            } catch (error) {
                log('Search failed: ' + JSON.stringify(error));
                showError('Search Error: ' + JSON.stringify(error));
            }
        }

        // Helper: extract display name from a Lookup field for rendering.
        // v1.1: prefers the resolved client-side map (populated from step-1 and
        // backfill queries); falls back to whatever shape COQL returned.
        function lookupName(val, nameMap) {
            if (!val) return '';
            const id = lookupRawId(val);
            if (id && nameMap && nameMap.has(id)) return nameMap.get(id);
            // Fallbacks for unexpected shapes.
            if (typeof val === 'object' && val.name) return val.name;
            if (typeof val === 'string') return val; // raw ID; better than [object Object]
            return '';
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function displayResults(records) {
            let html = '<div class="result-count">' + records.length + ' result' + (records.length !== 1 ? 's' : '') + ' found</div>';
            html += '<table><thead><tr>' +
                '<th>Referral ID</th>' +
                '<th>Claimant Name</th>' +
                '<th>DOB</th>' +
                '<th>Claim #</th>' +
                '<th>Status</th>' +
                '<th>Action</th>' +
                '</tr></thead><tbody>';

            for (let i = 0; i < records.length; i++) {
                let record = records[i];
                let rName = record.Deal_Name || '-';
                let rID = record.Referral_Number || '-';
                let cNum = record.Claim_Number || '-';
                let dob = record.Claimant_DOB || '-';
                let status = record.Referral_Status || 'Active';
                let recordId = record.id;
                let payerName = lookupName(record.Account_Name, accountNameById) || '(none)';
                let adjusterName = lookupName(record.Contact_Name, contactNameById) || '(none)';

                // Section 12.2: hardcoded status colors don't match real picklist
                // values; retained from baseline for v1.0.
                let statusClass = 'status-pending';
                if (status === 'Closed') statusClass = 'status-closed';
                if (status === 'Active' || status === 'Approved') statusClass = 'status-active';

                // Style 2: primary row carries the existing columns; secondary row
                // spans full width below it with Payer and Adjuster.
                // Section 12.1: duplicate Open Case button retained from baseline for v1.0.
                html += '<tr class="primary-row">' +
                    '<td><strong>' + escapeHtml(rID) + '</strong></td>' +
                    '<td>' + escapeHtml(rName) + '</td>' +
                    '<td>' + escapeHtml(dob) + '</td>' +
                    '<td>' + escapeHtml(cNum) + '</td>' +
                    '<td><span class="status-badge ' + statusClass + '">' + escapeHtml(status) + '</span></td>' +
                    '<td><button class="btn-open" onclick="openRecord(\'' + recordId + '\')">Open Case ↗️</button>' +
                    '<button class="btn-open" onclick="openRecord(\'' + recordId + '\')" style="margin-left:12px;">Open Case ↗️</button></td>' +
                    '</tr>';
                html += '<tr class="secondary-row">' +
                    '<td colspan="6">' +
                    '<span class="label">Payer:</span> ' + escapeHtml(payerName) +
                    '<span class="sep">·</span>' +
                    '<span class="label">Adjuster:</span> ' + escapeHtml(adjusterName) +
                    '</td>' +
                    '</tr>';
            }

            html += '</tbody></table>';
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = html;
            resultsDiv.style.display = 'block';
        }

        function openRecord(recordId) {
            ZOHO.CRM.UI.Record.open({
                Entity: "Deals",
                RecordID: recordId,
                Target: "_blank"
            }).then(function(data){
                log('Record Opened: ' + JSON.stringify(data));
            });
        }

        function showError(message) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="error-message"><strong>⚠️ Status:</strong> ' + escapeHtml(message) + '</div>';
            resultsDiv.style.display = 'block';
        }
    </script>
</body>
</html>
